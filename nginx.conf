server {
    listen 80;
    
    # Replace with your domain name
    server_name tutor.livenotice.co.uk;
    
    # Root directory where your built files are located
    root /path/to/your/build/directory;
    
    # Index file
    index index.html;
    
    # Gzip settings for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Caching settings for static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
    
    # API proxy (if your frontend needs to call your backend API)
    location /api/ {
        proxy_pass https://your-backend-api.onrender.com/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
    
    # This is the most important part - serve index.html for any route
    location / {
        try_files $uri $uri/ /index.html;
    }
}